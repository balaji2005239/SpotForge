name: gpu-spot-market

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: spot
      POSTGRES_PASSWORD: spot
      POSTGRES_DB: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/init-databases.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spot"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:3.8.0
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 20

  wallet:
    build:
      context: .
      dockerfile: services/wallet/Dockerfile
    environment:
      WALLET_DATABASE_URL: postgresql+psycopg://spot:spot@postgres:5432/wallet
      MIGRATE_ON_START: "1"    # Alembic: each service migrates its own database at boot
    depends_on:
      postgres: { condition: service_healthy }

  bid:
    build:
      context: .
      dockerfile: services/bid/Dockerfile
    environment:
      BID_DATABASE_URL: postgresql+psycopg://spot:spot@postgres:5432/bid
      WALLET_URL: http://wallet:8001
      KAFKA_BOOTSTRAP: kafka:9092
      RUN_RELAY: "1"
      RUN_CONSUMER: "1"   # allocation.* -> bid status
      MIGRATE_ON_START: "1"
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
      wallet: { condition: service_started }

  capacity:
    build:
      context: .
      dockerfile: services/capacity/Dockerfile
    environment:
      CAPACITY_DATABASE_URL: postgresql+psycopg://spot:spot@postgres:5432/capacity
      KAFKA_BOOTSTRAP: kafka:9092
      RUN_SWEEPER: "1"
      RUN_RELAY: "1"
      HEARTBEAT_TIMEOUT_S: "10"
      MIGRATE_ON_START: "1"
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }

  market:
    build:
      context: .
      dockerfile: services/market/Dockerfile
    environment:
      MARKET_DATABASE_URL: postgresql+psycopg://spot:spot@postgres:5432/market
      REDIS_URL: redis://redis:6379/0   # the ticker publishes each cleared tick here
      CAPACITY_URL: http://capacity:8003
      KAFKA_BOOTSTRAP: kafka:9092
      RUN_TICKER: "1"     # safe on several replicas: one leads (lease + fencing), the rest stand by
      RUN_CONSUMER: "1"
      RUN_RELAY: "1"
      MIGRATE_ON_START: "1"
    depends_on:
      redis: { condition: service_healthy }
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
      capacity: { condition: service_started }

  settlement-api:
    build:
      context: .
      dockerfile: services/settlement/Dockerfile
    environment:
      SETTLEMENT_DATABASE_URL: postgresql+psycopg://spot:spot@postgres:5432/settlement
      WALLET_URL: http://wallet:8001
      KAFKA_BOOTSTRAP: kafka:9092
      RUN_CONSUMER: "1"   # market.cleared -> durable settlement items
      MIGRATE_ON_START: "1"
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
      wallet: { condition: service_started }

  settlement-worker:
    build:
      context: .
      dockerfile: services/settlement/Dockerfile
    command: ["celery", "-A", "settlement_svc.celery_app", "worker", "-B", "-l", "info", "--concurrency", "2"]
    environment:
      SETTLEMENT_DATABASE_URL: postgresql+psycopg://spot:spot@postgres:5432/settlement
      WALLET_URL: http://wallet:8001
      REDIS_URL: redis://redis:6379/0
      MIGRATE_ON_START: "1"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      settlement-api: { condition: service_started }   # creates the tables first

  worker-sim:
    build:
      context: .
      dockerfile: services/worker_sim/Dockerfile
    environment:
      CAPACITY_URL: http://capacity:8003
      NODES: "T4:2x8,A100:2x8,H100:1x8"
      FAIL_RATE: "0"      # try 0.05 to see node failures cause preemptions
    depends_on:
      capacity: { condition: service_started }

  gateway:
    build:
      context: .
      dockerfile: services/gateway/Dockerfile
    environment:
      GATEWAY_DATABASE_URL: postgresql+psycopg://spot:spot@postgres:5432/gateway
      REDIS_URL: redis://redis:6379/0   # shared login/bid limits + live-feed fan-out across gateway replicas
      MIGRATE_ON_START: "1"
      WALLET_URL: http://wallet:8001
      BID_URL: http://bid:8002
      CAPACITY_URL: http://capacity:8003
      MARKET_URL: http://market:8004
      SETTLEMENT_URL: http://settlement-api:8005
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me-before-deploying-0000}   # 32+ random chars in real use
      ADMIN_USERNAMES: admin    # whoever signs up with these names gets the fleet/ops tab
      ALLOW_TEST_DEPOSIT: "1"   # the "Add $100 test funds" button; turn off outside demos
    ports: ["8000:8000"]        # the ONLY service port published; everything else is internal
    depends_on:
      redis: { condition: service_healthy }
      postgres: { condition: service_healthy }
      wallet: { condition: service_started }
      bid: { condition: service_started }
      capacity: { condition: service_started }
      market: { condition: service_started }
      settlement-api: { condition: service_started }

  web:
    build:
      context: frontend
    ports: ["8080:80"]   # UI at http://localhost:8080
    depends_on: [gateway]

volumes:
  pgdata:
