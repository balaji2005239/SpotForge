[project]
name = "gpu-spot-market"
version = "0.1.0"
requires-python = ">=3.10"

[tool.pytest.ini_options]
pythonpath = ["libs/spotcommon", "libs/clearing_core", "services/wallet", "services/bid", "services/capacity", "services/market", "services/settlement", "services/gateway", "services/worker_sim"]
testpaths = ["libs", "services", "tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "B904"]  # B008: FastAPI Depends() idiom; B904: HTTPException mapping

[tool.ruff.lint.per-file-ignores]
"**/tests/*" = ["E501"]
